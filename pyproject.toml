[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
version = "0.1.0"
description = "The Relay: a measured paper-grounded assistant"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PyMuPDF==1.26.5",
]

[project.scripts]
relay-download = "relay.ingest.download:main"

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
